name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repository. Actions are pinned by commit SHA.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total;const r=["lines","statements","functions","branches"].map(k=>`| ${k} | ${t[k].pct}% |`);console.log(["### Test coverage","| metric | covered |","|---|---|",...r].join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The build above is reused, so the E2E suite does not build a second time.
      - run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
      # Firebase emulators: the Firestore security-rule tests and the signed-in E2E.
      # firebase-tools 15 needs Java 21+.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.17.0
      - run: npm run test:emulator
      # Signed-in journeys against the Auth and Firestore emulators. This needs its own build:
      # Next.js bakes NEXT_PUBLIC_* (the emulator host, the placeholder web config) into the browser
      # code at build time, and the keyless build above has none.
      - run: npm run test:e2e:emulators
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-report-emulators
